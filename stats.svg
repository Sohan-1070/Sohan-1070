<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="460" height="260"><style>.mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,'IBM Plex Mono','Cascadia Code',Consolas,'Courier New',monospace;}</style><defs>
<filter id="glowSm" x="-60%" y="-60%" width="220%" height="220%">
  <feGaussianBlur stdDeviation="2.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowMd" x="-80%" y="-80%" width="260%" height="260%">
  <feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glowLg" x="-120%" y="-120%" width="340%" height="340%">
  <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
</filter>

<linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#00FF6A"/><stop offset="55%" stop-color="#7CFFC4"/><stop offset="100%" stop-color="#22F0FF"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="6s" begin="1s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="brandGradStatic" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#00FF6A"/><stop offset="100%" stop-color="#22F0FF"/>
</linearGradient>
</defs><rect x="1" y="1" width="458" height="258" rx="16" fill="rgba(7,18,15,0.55)" stroke="rgba(0,255,138,0.22)"/><text x="22" y="34" font-size="15" font-weight="700" class="mono" fill="#D9FFE9">GitHub Stats</text><line x1="22" y1="46" x2="438" y2="46" stroke="rgba(0,255,138,0.22)"/>
    <circle cx="92" cy="158" r="58" fill="none" stroke="rgba(0,255,138,0.22)" stroke-width="10"/>
    <circle cx="92" cy="158" r="58" fill="none" stroke="url(#brandGrad)" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="331.63 364.42" transform="rotate(-90 92 158)" opacity="0">
      <set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="0.3s"/>
      <animate attributeName="stroke-dasharray" from="0 364.42" to="331.63 364.42"
        begin="0.3s" dur="1.4s" calcMode="spline" keySplines="0.2 0.7 0.3 1" fill="freeze"/>
    </circle><text x="92" y="168" font-size="30" font-weight="800" text-anchor="middle" class="mono" fill="url(#brandGrad)" opacity="0">A+<set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="1.1s"/></text><text x="92" y="240" font-size="10.5" text-anchor="middle" fill="#345347" class="mono">RANK</text><g transform="translate(0,66)" opacity="0"><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="0.40s"/><animateTransform attributeName="transform" type="translate" values="218,66;192,66" dur="0.4s" begin="0.40s" fill="freeze"/><circle cx="0" cy="-4" r="3" fill="#00FF6A"/><text x="12" y="0" font-size="12.5" class="mono" fill="#5C8A73">Total Stars</text><text x="244" y="0" font-size="13.5" font-weight="700" text-anchor="end" class="mono" fill="#D9FFE9">2.4k</text></g><g transform="translate(0,100)" opacity="0"><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="0.55s"/><animateTransform attributeName="transform" type="translate" values="218,100;192,100" dur="0.4s" begin="0.55s" fill="freeze"/><circle cx="0" cy="-4" r="3" fill="#00FF6A"/><text x="12" y="0" font-size="12.5" class="mono" fill="#5C8A73">Total Commits</text><text x="244" y="0" font-size="13.5" font-weight="700" text-anchor="end" class="mono" fill="#D9FFE9">3,180</text></g><g transform="translate(0,134)" opacity="0"><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="0.70s"/><animateTransform attributeName="transform" type="translate" values="218,134;192,134" dur="0.4s" begin="0.70s" fill="freeze"/><circle cx="0" cy="-4" r="3" fill="#00FF6A"/><text x="12" y="0" font-size="12.5" class="mono" fill="#5C8A73">Total PRs</text><text x="244" y="0" font-size="13.5" font-weight="700" text-anchor="end" class="mono" fill="#D9FFE9">142</text></g><g transform="translate(0,168)" opacity="0"><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="0.85s"/><animateTransform attributeName="transform" type="translate" values="218,168;192,168" dur="0.4s" begin="0.85s" fill="freeze"/><circle cx="0" cy="-4" r="3" fill="#00FF6A"/><text x="12" y="0" font-size="12.5" class="mono" fill="#5C8A73">Total Issues</text><text x="244" y="0" font-size="13.5" font-weight="700" text-anchor="end" class="mono" fill="#D9FFE9">58</text></g><g transform="translate(0,202)" opacity="0"><set attributeName="opacity" to="0" begin="0s"/><set attributeName="opacity" to="1" begin="1.00s"/><animateTransform attributeName="transform" type="translate" values="218,202;192,202" dur="0.4s" begin="1.00s" fill="freeze"/><circle cx="0" cy="-4" r="3" fill="#00FF6A"/><text x="12" y="0" font-size="12.5" class="mono" fill="#5C8A73">Contributed to</text><text x="244" y="0" font-size="13.5" font-weight="700" text-anchor="end" class="mono" fill="#D9FFE9">27 repos</text></g></svg>