name: generate profile snake

on:
  schedule:
    - cron: "0 2 * * *"     # daily at 02:00 UTC — adjust to taste
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake animations
        uses: Platane/snk@v3
        id: snake
        with:
          # github.repository_owner resolves automatically — no hardcoded username needed
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#00FF6A&color_dots=#0d2b1f,#0f5c39,#12864f,#17b56b,#22ff87

      - name: push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# If this fails with a permissions error on the push step:
#   Settings -> Actions -> General -> Workflow permissions -> "Read and write permissions"
# on this repo. GITHUB_TOKEN can't create branches on a repo with read-only default token
# permissions, and a personal access token isn't needed unless you've locked that down further.
